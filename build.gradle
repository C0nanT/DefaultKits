plugins {
    id 'java'
}

group = 'com.example.plugin'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // HytaleServer API
    compileOnly files('libs/HytaleServer.jar')
}

jar {
    archiveBaseName = 'DefaultKits'
    // Produce a fixed filename to ensure overwrite on rebuild
    archiveFileName = 'DefaultKits.jar'
    // No CI: coloca na pasta anterior para usar no servidor
    // Em CI (GitHub Actions): usa a pasta build/libs/ padrão
    destinationDirectory = file(System.getenv('CI') ? "$buildDir/libs" : "$rootDir/..")

    manifest {
        attributes(
            'Implementation-Title': 'DefaultKits',
            'Implementation-Version': version
        )
    }
}

// Ensure `clean` also removes the external jar placed in the parent directory
tasks.register('cleanExternalJar', Delete) {
    delete file("$rootDir/../DefaultKits.jar")
}

tasks.named('clean') {
    dependsOn 'cleanExternalJar'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
